[package]
name = "nostr-bunker-outlayer"
version = "5.0.0"
edition = "2021"
description = "Multi-user Nostr Bunker with v1.signer MPC signing in OutLayer TEE"

[[bin]]
name = "nostr-bunker-outlayer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
borsh = "1.0"

# NEAR SDK for transaction signing
near-crypto = "0.26"
near-primitives = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# OutLayer provides HTTP via host functions

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
