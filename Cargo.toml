[package]
name = "nostr-bunker-outlayer"
version = "4.0.0"
edition = "2021"
description = "Nostr Bunker with v1.signer MPC signing in OutLayer TEE"

[[bin]]
name = "nostr-bunker-outlayer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# OutLayer provides HTTP via host functions - no external deps needed

[profile.release]
opt-level = "z"
lto = true
strip = true
