[package]
name = "nostr-bunker-outlayer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nostr-bunker-outlayer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
