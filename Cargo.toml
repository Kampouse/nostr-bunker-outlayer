[package]
name = "nostr-bunker-outlayer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nostr-bunker-outlayer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
