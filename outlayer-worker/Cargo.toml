[package]
name = "nostr-bunker-outlayer"
version = "0.1.0"
edition = "2021"
authors = ["Kampouse"]
description = "NEAR + Nostr bunker using OutLayer TEE"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dependencies.wit-bindgen]
version = "0.36"
features = ["macros"]

[profile.release]
opt-level = "s"
lto = true
